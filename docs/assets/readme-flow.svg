<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" fill="none">
  <rect width="1280" height="250" rx="18" fill="#0B0E14"/>
  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="36" y="43" fill="#F1F4F7" font-size="17" font-weight="700">From repository to evidence</text><text x="36" y="66" fill="#8993A1" font-size="12">No project execution. No guessed edges. Every resolved import keeps its location.</text>
    <g transform="translate(36 99)"><rect width="248" height="112" rx="12" fill="#141A24" stroke="#343C49"/><text x="18" y="28" fill="#92EDC7" font-size="10" font-weight="700" letter-spacing="1">01 · INPUT</text><text x="18" y="57" fill="#E8ECF2" font-size="16" font-weight="650">GitHub repo or folder</text><text x="18" y="82" fill="#929CAB" font-size="12">TypeScript source + package metadata</text><text x="18" y="99" fill="#929CAB" font-size="12">read locally, then summarized</text></g>
    <g transform="translate(352 99)"><rect width="248" height="112" rx="12" fill="#141A24" stroke="#343C49"/><text x="18" y="28" fill="#B4A0FF" font-size="10" font-weight="700" letter-spacing="1">02 · RESOLVE</text><text x="18" y="57" fill="#E8ECF2" font-size="16" font-weight="650">Static import analysis</text><text x="18" y="82" fill="#929CAB" font-size="12">Resolve paths, workspaces, entry points</text><text x="18" y="99" fill="#929CAB" font-size="12">keep unknown targets explicit</text></g>
    <g transform="translate(668 99)"><rect width="248" height="112" rx="12" fill="#141A24" stroke="#343C49"/><text x="18" y="28" fill="#92EDC7" font-size="10" font-weight="700" letter-spacing="1">03 · EXPLORE</text><text x="18" y="57" fill="#E8ECF2" font-size="16" font-weight="650">Interactive module map</text><text x="18" y="82" fill="#929CAB" font-size="12">Filter, trace paths, inspect boundaries</text><text x="18" y="99" fill="#929CAB" font-size="12">share a focused view with a link</text></g>
    <g transform="translate(984 99)"><rect width="260" height="112" rx="12" fill="#141A24" stroke="#92EDC7" stroke-opacity=".6"/><text x="18" y="28" fill="#B4A0FF" font-size="10" font-weight="700" letter-spacing="1">04 · VERIFY</text><text x="18" y="57" fill="#E8ECF2" font-size="16" font-weight="650">Exact source evidence</text><text x="18" y="82" fill="#929CAB" font-size="12">Select an edge to inspect its import</text><text x="18" y="99" fill="#929CAB" font-size="12">and jump to the corresponding line</text></g>
    <g stroke-linecap="round"><path d="M294 155h44M610 155h44M926 155h44" stroke="#3A4250" stroke-width="2"/><path d="M294 155h44M610 155h44M926 155h44" stroke="#92EDC7" stroke-width="2" stroke-dasharray="4 10"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.8s" repeatCount="indefinite"/></path></g>
  </g>
</svg>
