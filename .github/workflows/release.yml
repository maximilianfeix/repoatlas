name: Release
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run check:ts7
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG!==`v${p.version}`) { console.error(`Tag ${process.env.RELEASE_TAG} does not match package version ${p.version}`); process.exit(1) }'
      - name: Package CLI
        run: npm pack
      - name: Prepare release notes from the changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v heading="## [$version]" '($0 == heading || index($0, heading " ") == 1) { capture=1; next } capture && /^## \[/ { exit } capture { print }' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.tgz --clobber
            gh release edit "$GITHUB_REF_NAME" --title "RepoAtlas ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" ./*.tgz --title "RepoAtlas ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi
