name: Action smoke test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate a map with the local action
        uses: ./
        with:
          path: .
          output: repoatlas-smoke-map.html
          include-js: true
          artifact-name: repoatlas-smoke-map
          retention-days: 1
      - name: Verify map output
        run: test -s repoatlas-smoke-map.html && grep -q 'RepoAtlas' repoatlas-smoke-map.html && grep -q 'scripts/examples.mjs' repoatlas-smoke-map.html
